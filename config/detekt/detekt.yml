naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable

style:
  ForbiddenComment:
    comments:
      - value: 'FIXME:'
        reason: 'Forbidden FIXME marker in comment, please fix the problem.'
      - value: 'STOPSHIP:'
        reason: 'Forbidden STOPSHIP marker in comment, please take the necessary action.'
  MagicNumber:
    ignoreEnums: true
    ignoreAnnotated:
      - Preview
    excludes:
      - '**/test/**'
      - '**/*Test/**'
