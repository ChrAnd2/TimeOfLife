name: CI

on:
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Lint, build, test (Android/JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changelog
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- changelog/current.md; then
            echo "::error file=changelog/current.md::changelog/current.md was not changed in this pull request. Add your changes to the changelog."
            exit 1
          fi

      - name: Check open TODOs of this ticket
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          ticket=$(grep -oE 'ToL-[0-9]+' <<< "$BRANCH" | head -n 1 || true)
          if [ -z "$ticket" ]; then
            echo "::warning::Branch $BRANCH has no ToL-<number> ticket, skipping the TODO check."
            exit 0
          fi
          if git grep -nF "TODO($ticket)" -- ':!changelog/' > todos.txt; then
            while IFS=: read -r file line text; do
              echo "::error file=$file,line=$line::Open TODO of $ticket, resolve it before merging."
            done < todos.txt
            exit 1
          fi
          echo "No open TODOs for $ticket."

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint (detekt)
        run: ./gradlew detekt

      - name: Build
        run: ./gradlew :androidApp:assembleDebug

      - name: Test
        run: ./gradlew :sharedLogic:testAndroidHostTest :androidApp:testDebugUnitTest

      - name: Coverage
        run: |
          ./gradlew koverXmlReport koverHtmlReport
          echo "### Line coverage" >> "$GITHUB_STEP_SUMMARY"
          ./gradlew koverLog --quiet | grep '%' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/detekt/
            **/build/reports/tests/
            **/build/test-results/
            build/reports/kover/
          if-no-files-found: ignore

